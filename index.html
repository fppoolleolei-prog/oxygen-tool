<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>酸素ボンベ計算ツール</title>

<style>
body{
font-family:Arial;
margin:0;
padding:18px;
font-size:18px;
background:#f4f7fb;
}

.container{max-width:980px;margin:auto}

.card{
background:#fff;
border-radius:16px;
padding:20px;
box-shadow:0 6px 18px rgba(0,0,0,0.08)
}

h1{font-size:24px;margin-bottom:14px}

#mode{font-size:20px;font-weight:bold}

label{
display:block;
margin-top:14px;
font-weight:bold;
font-size:18px;
}

.inputRow{
display:flex;
align-items:center;
gap:8px
}

.inputRow input{flex:0.7}
.inputRow img{max-height:100%;}

.pressureImg{width:150px;height:auto;}
.flowImg{width:auto;height:180px;}

input,select{
width:100%;
padding:14px;
border-radius:10px;
border:1px solid #ccc;
margin-top:6px;
font-size:18px;
box-sizing:border-box;
}

button{
padding:16px;
border:none;
border-radius:14px;
font-size:18px;
}

.calc{
background:#43a047;
color:#fff;
width:100%;
margin-top:20px;
font-size:20px;
}

.quickBtns{
display:flex;
gap:10px;
margin-top:12px;
}

.quickBtns button{
flex:1;
background:#1976d2;
color:#fff;
font-weight:bold;
padding:16px;
}

.result{
margin-top:16px;
padding:16px;
background:#f1f6ff;
border-radius:12px;
font-size:20px;
}

.warn{color:#d64545;font-weight:bold}
.safe{color:#2e7d32;font-weight:bold}
.note{font-size:16px;color:#333;margin-top:8px;font-weight:bold}
.small{font-size:14px;font-weight:normal}

/* NPPV左右レイアウト */
.nppvLayout{
display:flex;
gap:18px;
align-items:flex-start;
margin-top:12px;
}

.nppvLeft{
flex:1;
min-width:260px;
}

.nppvRight{
flex:1;
}

/* 画像 */
.screenWrap{
position:relative;
margin-top:10px;
}

.screenImg{
width:100%;
border-radius:14px;
border:2px solid #ccc;
}

.hotspot{
position:absolute;
border:4px solid;
border-radius:12px;
background:rgba(255,255,255,0.05);
cursor:pointer;
}

.yellow{border-color:#ffe600}
.green{border-color:#00d26a}
.red{border-color:#ff3b30}

.inputHighlight{
background:#e8f2ff;
border:3px solid #1976d2 !important;
}

/* 入力欄カラー */
#fio2{
border-left:8px solid #ff3b30;
}

#totalFlow{
border-left:8px solid #ffe600;
}

#leak{
border-left:8px solid #00d26a;
}

@media(max-width:700px){
.nppvLayout{
flex-direction:column;
}
}
</style>
</head>

<body>

<div class="container">
<div class="card">

<h1>酸素ボンベ計算ツール</h1>

<label>モード</label>
<select id="mode">
<option value="normal">通常酸素</option>
<option value="nppv" selected>NPPV(バイパップ)</option>
<option value="vent">呼吸器</option>
</select>

<div id="nppvMachineArea" style="display:none;margin-top:10px;">
<label>NPPV機種選択</label>
<select id="nppvMachine" onchange="changeNPPVMachine()">
<option value="v60">V60</option>
<option value="nkv">NKV</option>
</select>
</div>

<label>ボンベ圧 (MPa)</label>
<div class="inputRow">
<input id="pressure" type="number" value="10">
<img src="https://dummyimage.com/150x150/eeeeee/555555&text=Pressure" class="pressureImg">
</div>

<div class="quickBtns">
<button type="button">14.7MPa</button>
<button type="button">10MPa</button>
<button type="button">5MPa</button>
</div>

<div class="note">＊酸素ボンベの満タンは14.7MPaです</div>

<div id="nppvFields">



<div class="nppvLayout">

<!-- 左：入力 -->
<div class="nppvLeft">

<label>FiO2 (%)</label>
<input id="fio2" type="number" value="60">

<label>分時換気量 (L/min)</label>
<input id="totalFlow" type="number" value="8.8">

<label>リーク量 (L/min)</label>
<input id="leak" type="number" value="20">

</div>

<!-- 右：画像 -->
<div class="nppvRight">

<div class="note">
画像の色枠をタップすると入力欄へ移動します
</div>

<!-- V60 -->
<div class="screenWrap" id="v60Wrap">
<img src="/mnt/data/V60丸.png" class="screenImg">

<button class="hotspot yellow"
style="top:21%;left:3%;width:22%;height:18%;"
onclick="focusInput('totalFlow')"></button>

<button class="hotspot green"
style="top:67%;left:3%;width:23%;height:15%;"
onclick="focusInput('leak')"></button>

<button class="hotspot red"
style="bottom:1%;right:1%;width:24%;height:14%;"
onclick="focusInput('fio2')"></button>
</div>

<!-- NKV -->
<div class="screenWrap" id="nkvWrap" style="display:none">
<img src="/mnt/data/NKV丸.png" class="screenImg">

<button class="hotspot yellow"
style="top:10%;left:48%;width:18%;height:13%;"
onclick="focusInput('totalFlow')"></button>

<button class="hotspot green"
style="top:18%;left:2%;width:22%;height:16%;"
onclick="focusInput('leak')"></button>

<button class="hotspot red"
style="bottom:8%;left:24%;width:16%;height:15%;"
onclick="focusInput('fio2')"></button>
</div>

</div>
</div>
</div>

<button type="button" class="calc" onclick="calc()">計算</button>

<div id="result" class="result">
<div style='font-size:32px;font-weight:bold'>残り 34 分</div>
<div>酸素消費 8.0 L/min</div><br>
<div class='safe'>✔ 使用可能</div>
</div>

</div>
</div>

<script>
function changeNPPVMachine(){

let machine = document.getElementById("nppvMachine").value

document.getElementById("v60Wrap").style.display="none"
document.getElementById("nkvWrap").style.display="none"

if(machine==="v60"){
document.getElementById("v60Wrap").style.display="block"
}

if(machine==="nkv"){
document.getElementById("nkvWrap").style.display="block"
}
}

function focusInput(id){

document.querySelectorAll("input").forEach(el=>{
el.classList.remove("inputHighlight")
})

document.getElementById(id).focus()
document.getElementById(id).classList.add("inputHighlight")
}

const mode=document.getElementById("mode")

mode.addEventListener("change",()=>{

// 通常酸素
const isNormal = mode.value==="normal"
document.getElementById("normalFields").style.display =
isNormal ? "block" : "none"

// NPPV
const isNPPV = mode.value==="nppv"
document.getElementById("nppvMachineArea").style.display =
isNPPV ? "block" : "none"

document.getElementById("nppvFields").style.display =
isNPPV ? "block" : "none"

// 呼吸器
const isVent = mode.value==="vent"
document.getElementById("ventFields").style.display =
isVent ? "block" : "none"

})

mode.dispatchEvent(new Event("change"))

function calc(){
alert('計算動作サンプル')
}
</script>

</body>
</html>
